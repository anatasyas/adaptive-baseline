<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Baseline - Non Adaptive Learning</title>
  <style>
    body{font-family:Arial; margin:20px; background:#f0f0f0;}
    .card{background:white; padding:20px; border-radius:10px; max-width:600px; margin:40px auto;}
    button{margin:5px; padding:10px 20px;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Baseline Learning (Non-Adaptive)</h1>
    <p id="question"></p>
    <div id="options"></div>
    <button onclick="nextQuestion()">Soal Berikutnya</button>
  </div>

  <script>
    let currentQ = null;

    async function nextQuestion() {
      const res = await fetch('/api/next-question');
      currentQ = await res.json();
      document.getElementById("question").innerHTML = currentQ.q;
      const opts = document.getElementById("options");
      opts.innerHTML = "";
      currentQ.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => submitAnswer(opt);
        opts.appendChild(btn);
      });
    }

    async function submitAnswer(selected) {
      const res = await fetch('/api/answer', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({answer: currentQ.answer, selected})
      });
      const data = await res.json();
      alert(data.message);
      nextQuestion();
    }

    nextQuestion();
  </script>
</body>
</html>
